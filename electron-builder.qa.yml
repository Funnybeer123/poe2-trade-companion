appId: com.funnybeer.poe2tc.qa
productName: PoE2 QA Automation (Authorized)
executableName: poe2-qa-automation
copyright: Copyright © 2026
asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
  - "**/koffi/**"
directories:
  output: release/qa
files:
  - package.json
  - apps/desktop/dist/**/*
  - apps/overlay/dist/**/*
  - packages/core/package.json
  - packages/core/src/**/*
  - packages/persistence-sqlite/package.json
  - packages/persistence-sqlite/src/**/*
  - packages/native-input/package.json
  - packages/native-input/src/**/*
  - packages/perception-live/package.json
  - packages/perception-live/src/**/*
  - packages/testkit/package.json
  - packages/testkit/src/**/*
  - migrations/**/*
  - fixtures/**/*
  - "!**/*.map"
  - from: node_modules/better-sqlite3
    to: node_modules/better-sqlite3
  - from: node_modules/bindings
    to: node_modules/bindings
  - from: node_modules/file-uri-to-path
    to: node_modules/file-uri-to-path
  - from: node_modules/koffi
    to: node_modules/koffi
extraMetadata:
  main: apps/desktop/dist/electron-main.js
  poe2tcMode: authorized-qa
win:
  target: []
linux:
  target:
    - dir
mac:
  target: []
electronVersion: 40.10.6
