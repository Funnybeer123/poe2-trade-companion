name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Windows-only project: the input host is PowerShell and the packaged
    # target is win32. Steps mirror `npm run check` + `npm run test:all` +
    # `npm run build` exactly, so a green local gate predicts a green CI.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
      POE2_BUILD_MODE: "public-companion"
      POE2_ENABLE_LIVE_INPUT: "0"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Electron's postinstall downloads its binary here; the Vitest suites
      # run under it (ELECTRON_RUN_AS_NODE=1) so better-sqlite3 loads with the
      # ABI the app uses. The better-sqlite3 prebuilt fetched for Node 24 also
      # loads under Electron 34, so no rebuild step is needed.
      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (all Vitest suites under Electron-as-Node)
        run: npm run test:all

      - name: Build
        run: npm run build

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/**/*.log
            artifacts/**/*.jsonl
