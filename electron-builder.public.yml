appId: com.funnybeer.poe2tc.public
productName: PoE2 Trade Companion
executableName: poe2-trade-companion
copyright: Copyright © 2026
asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
directories:
  output: release/public
files:
  - package.json
  - apps/desktop/dist/**/*
  - apps/overlay/dist/**/*
  - packages/core/package.json
  - packages/core/src/**/*
  - packages/persistence-sqlite/package.json
  - packages/persistence-sqlite/src/**/*
  - packages/testkit/package.json
  - packages/testkit/src/**/*
  - migrations/**/*
  - fixtures/**/*
  - "!packages/native-input/**"
  - "!node_modules/koffi/**"
  - "!node_modules/@poe2tc/native-input/**"
  - "!**/*.map"
  - from: node_modules/better-sqlite3
    to: node_modules/better-sqlite3
  - from: node_modules/bindings
    to: node_modules/bindings
  - from: node_modules/file-uri-to-path
    to: node_modules/file-uri-to-path
extraMetadata:
  main: apps/desktop/dist/electron-main.js
  poe2tcMode: public-companion
win:
  target: []
linux:
  target:
    - dir
mac:
  target: []
electronVersion: 40.10.6
